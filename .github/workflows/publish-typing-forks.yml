name: Publish typing forks
on:
  workflow_dispatch:
    inputs:
      mypy_revision:
        description: Full commit SHA from ang-ee/mypy
        required: true
        type: string
      django_stubs_revision:
        description: Full commit SHA from ang-ee/django-stubs
        required: true
        type: string
      publish_mypy:
        description: Publish angee-mypy
        type: boolean
        default: false
      publish_stubs:
        description: Publish angee-django-stubs
        type: boolean
        default: false
      publish_extensions:
        description: Publish angee-django-stubs-ext
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pypi-publish
  cancel-in-progress: false
jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - name: Require immutable revisions and a package selection
        env:
          MYPY_REVISION: ${{ inputs.mypy_revision }}
          STUBS_REVISION: ${{ inputs.django_stubs_revision }}
          PACKAGE_SELECTED: ${{ inputs.publish_mypy || inputs.publish_stubs || inputs.publish_extensions }}
        run: |
          [[ "$MYPY_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$STUBS_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PACKAGE_SELECTED" == "true" ]]
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ang-ee/mypy
          ref: ${{ inputs.mypy_revision }}
          path: forks/mypy
      - uses: actions/checkout@v4
        with:
          repository: ang-ee/django-stubs
          ref: ${{ inputs.django_stubs_revision }}
          path: forks/django-stubs
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
      - run: uv python install 3.14
      - run: uv build --no-sources --out-dir ../../dist
        working-directory: forks/mypy
      - run: uv build --all-packages --no-sources --out-dir ../../dist
        working-directory: forks/django-stubs
      - run: uvx --from twine twine check dist/*
      - name: Install the exact wheels together
        run: |
          uv venv --python 3.14 .fork-venv
          uv pip install --python .fork-venv/bin/python --find-links dist dist/*.whl \
            'angee-django-stubs[compatible-mypy]' 'django>=6.1.2,<6.2' \
            packaging django-yamlconf pytest
          uv pip install --python .fork-venv/bin/python --no-deps -e .
      - name: Verify distribution identities and native imports
        run: |
          .fork-venv/bin/python - <<'PY'
          from email.parser import BytesParser
          from importlib.metadata import PackageNotFoundError, distribution, version
          from pathlib import Path
          from zipfile import ZipFile
          from packaging.requirements import Requirement
          from mypy_django_plugin.main import _package_version
          expected = {"angee-mypy", "angee-django-stubs", "angee-django-stubs-ext"}
          found = set()
          for wheel in Path("dist").glob("*.whl"):
              with ZipFile(wheel) as archive:
                  metadata_path, = (name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
                  metadata = BytesParser().parsebytes(archive.read(metadata_path))
              name = metadata["Name"]
              found.add(name)
              assert version(name) == metadata["Version"], name
              assert all(Requirement(value).url is None for value in metadata.get_all("Requires-Dist", []))
          assert found == expected, found
          for name in ("mypy", "django-stubs", "django-stubs-ext"):
              try:
                  distribution(name)
              except PackageNotFoundError:
                  continue
              raise AssertionError(f"Overlapping upstream distribution: {name}")
          for name in ("angee-django-stubs", "angee-django-stubs-ext"):
              assert _package_version(name) == version(name), name
          PY
          .fork-venv/bin/python -m mypy --version
      - name: Verify composed-model typing and native diagnostics
        run: .fork-venv/bin/python -m pytest -q tests/test_typing.py
      - uses: actions/upload-artifact@v4
        with:
          name: typing-distributions
          path: |
            ${{ inputs.publish_mypy && 'dist/angee_mypy-*' || '' }}
            ${{ inputs.publish_stubs && 'dist/angee_django_stubs-*' || '' }}
            ${{ inputs.publish_extensions && 'dist/angee_django_stubs_ext-*' || '' }}
  publish:
    needs: distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: typing-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
