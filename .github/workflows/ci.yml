name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv python install 3.14
      - run: make install
      - run: make check
      - run: make dist-check
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
