[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-compose"
version = "0.1.0.dev2"
description = "Compose reusable Django apps into a runnable project."
readme = "README.md"
requires-python = ">=3.14"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING", "NOTICE"]
authors = [{name = "Angee, Inc.", email = "hi@angee.ai"}]
dependencies = ["django>=6.1.2,<6.2", "packaging>=26", "django-yamlconf>=1.5"]

[project.urls]
Source = "https://github.com/ang-ee/django-compose"
Documentation = "https://github.com/ang-ee/django-compose/tree/main/docs"
Issues = "https://github.com/ang-ee/django-compose/issues"

[project.optional-dependencies]
typing = [
    "angee-django-stubs[compatible-mypy]==6.1.2.post3",
    "angee-django-stubs-ext==6.1.2",
    "angee-mypy==2.1.0",
]

[project.scripts]
django-compose = "django_compose.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.8", "ruff>=0.15.12", "hatchling>=1.27", "build>=1.2", "twine>=6", "psycopg[binary,pool]>=3.1.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/django_compose"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/scripts", "/docs", "/AGENTS.md", "/README.md", "/CONTRIBUTING.md", "/CHANGELOG.md", "/LICENSE", "/COPYING", "/NOTICE", "/Makefile", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/django_compose"]
ignore_missing_imports = true

