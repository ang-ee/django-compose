[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "compose-example-reviews"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = ["django-compose", "compose-example-catalog==1.0.0"]

[project.entry-points."compose.example"]
reviews = "reviews.apps.Config"

[tool.hatch.build.targets.wheel.force-include]
"." = "reviews"
