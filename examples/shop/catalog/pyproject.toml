[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "compose-example-catalog"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = ["django-compose"]

[project.entry-points."compose.example"]
catalog = "catalog.apps.Config"

[tool.hatch.build.targets.wheel.force-include]
"." = "catalog"
